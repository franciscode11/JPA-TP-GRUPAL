spring.application.name=factura-arca

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/facturacion_orm}
spring.datasource.username=${DB_USER:factura_user}
spring.datasource.password=${DB_PASSWORD:factura123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jackson.time-zone=America/Argentina/Mendoza

server.error.include-message=always

# ARCA: el proyecto queda bloqueado al ambiente de homologación.
arca.enabled=${ARCA_ENABLED:false}
arca.cuit=${ARCA_CUIT:}
arca.private-key-path=${ARCA_PRIVATE_KEY_PATH:}
arca.certificate-path=${ARCA_CERTIFICATE_PATH:}
arca.comprobante-tipo=${ARCA_COMPROBANTE_TIPO:11}
arca.wsaa-url=https://wsaahomo.afip.gov.ar/ws/services/LoginCms
arca.wsfe-url=https://wswhomo.afip.gov.ar/wsfev1/service.asmx
